<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poppies Fan Companion</title>
<meta name="description" content="Fixtures, results, predictions, away day guides, coach travel, car shares and the fan wall for Kettering Town FC supporters.">
<meta name="theme-color" content="#08080a">

<!-- What Facebook, WhatsApp and the rest read when somebody pastes a link.
     Without these there is no image, no title and no description: the post
     shows a bare URL, which is what was happening. og:image has to be an
     absolute URL, not a relative one, or it is ignored. Keep the card at
     1200x630; anything smaller and Facebook falls back to a thumbnail. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Poppies Fan Companion">
<meta property="og:title" content="Poppies Fan Companion">
<meta property="og:description" content="Fixtures, predictions, away day guides, coach travel, car shares and the fan wall for Kettering Town FC supporters. Free, and run by supporters.">
<meta property="og:url" content="https://fans.ktfcsa.com/">
<meta property="og:image" content="https://fans.ktfcsa.com/assets/img/share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Poppies Fan Companion, from the Kettering Town FC Supporters' Association">
<meta property="og:locale" content="en_GB">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Poppies Fan Companion">
<meta name="twitter:description" content="Fixtures, predictions, away day guides, coach travel, car shares and the fan wall for Kettering Town FC supporters.">
<meta name="twitter:image" content="https://fans.ktfcsa.com/assets/img/share-card.png">
<link rel="icon" href="assets/img/logo-192.png">
<link rel="apple-touch-icon" href="assets/img/logo-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/fixtures">
        <img class="brand__crest" src="assets/img/logo-128.png" alt="" width="34" height="34">
        <span class="brand__text">
          <span class="brand__name">Poppies Fan Companion</span>
          <span class="brand__sub">Kettering Town FC</span>
        </span>
      </a>
      <div class="topbar__spacer"></div>
      <div class="topbar__actions">
        <button id="account-btn" class="icon-btn" style="width:auto;padding:0 4px;background:none;border:none"
                aria-label="Your account"></button>
      </div>
    </div>
  </header>

  <nav id="sidebar" class="sidebar" aria-label="Sections"></nav>

  <main id="main" class="main"></main>
</div>

<nav id="tabbar" class="tabbar" aria-label="Sections"></nav>

<noscript>
  <div style="padding:24px;font-family:sans-serif;color:#f4f2ee">
    This app needs JavaScript switched on to show fixtures and travel details.
  </div>
</noscript>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>

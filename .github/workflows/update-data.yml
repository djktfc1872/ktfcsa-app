name: Update site data

# Keeps everything in data/ in step with its source: the Southern League API,
# The Poppycast feed, the club's YouTube channel and the clubs' own ticket
# pages. Nobody needs to touch this: if a fixture moves or a result comes in,
# the next run picks it up and the site updates itself.
on:
  schedule:
    # Every 20 minutes between 14:00 and 22:00 UTC, every day. Saturday and
    # midweek cover most of the season, but three fixtures fall on a Monday or
    # Friday (Stamford on 31 August, Leighton on 26 March, Banbury on Easter
    # Monday) and those results used to sit stale until the evening run.
    # The repository is public, so Actions minutes cost nothing.
    - cron: "*/20 14-22 * * *"
    # Early morning, to pick up a fixture change before anyone sets off.
    - cron: "15 7 * * *"
  workflow_dispatch: # lets an admin refresh on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # This also pushes fixtures into Supabase, which scores the prediction
      # league and doubles as the keep-alive that stops a free project pausing.
      - name: Fetch league table and fixtures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-league.mjs

      - name: Fetch podcast episodes
        continue-on-error: true # a podcast hiccup must not block fixture updates
        run: node scripts/fetch-podcast.mjs

      - name: Fetch club videos
        continue-on-error: true # YouTube being slow must never block results
        run: node scripts/fetch-youtube.mjs

      # Only a handful of clubs publish prices where a script can read them, but
      # every one we could read was wrong when this was first run. Sundays only:
      # the prices do not move week to week and the clubs' sites deserve the rest.
      # Rebuilds the Poppies Daily bank from the archive the league fetch just
      # wrote. Days already played are frozen, so this only ever adds to the
      # far end of the calendar. Never allowed to block a result going out.
      - name: Build the Poppies Daily questions
        continue-on-error: true
        run: node scripts/build-quiz.mjs

      - name: Check published ticket prices
        continue-on-error: true # a club site being down must never block results
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/check-prices.py
          else
            echo "Not Sunday, skipping the price check."
          fi

      - name: Commit any changes
        run: |
          git config user.name "KTFCSA data bot"
          git config user.email "actions@github.com"
          # The whole directory, not a list of files. This used to name
          # league.json and podcast.json only, so every video and price the
          # steps above fetched was rewritten each run and then thrown away —
          # the videos page only ever moved when somebody committed by hand.
          # A list has to be remembered; a directory does not.
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update data"
            git push
          fi
